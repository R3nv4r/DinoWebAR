<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi Primera Esfera en AR</title>
    <meta name="description" content="Una escena sencilla con una esfera en Realidad Aumentada usando A-Frame y AR.js.">
    <!-- Incluimos la librería de A-Frame (la versión 1.3.0 es la más recomendada para AR.js) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Incluimos AR.js para añadir las capacidades de Realidad Aumentada -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      /* Aseguramos que el body ocupe todo el espacio y quitamos márgenes */
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- El elemento <a-scene> adaptado para AR.js usando la cámara web -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Usamos el marcador predeterminado 'hiro'. Cuando la cámara lo vea, mostrará lo que hay dentro -->
      <a-marker preset="hiro">
        <!-- Redujimos un poco la esfera para que encaje mejor sobre el marcador -->
        <a-sphere position="0 0.5 0" radius="0.5" color="#EF2D5E"></a-sphere>
      </a-marker>
      
      <!-- La entidad cámara es obligatoria para procesar la realidad aumentada -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>

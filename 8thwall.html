<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>8th Wall - World Effect AR</title>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>
    
    <!-- Asegúrate de que esta ruta apunte correctamente al archivo que descargaste -->
    <script src="./external/xr/xr.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #111; 
        }

        #ar-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            color: white;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 80%;
        }

        h1 { margin-top: 0; font-size: 24px; color: #4CAF50; }
        p { font-size: 16px; line-height: 1.5; margin-bottom: 30px; }

        #start-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        #start-btn:active { transform: scale(0.95); }
        #start-btn:disabled { background-color: #555; cursor: not-allowed; }

        /* Consola de errores visual en pantalla */
        #error-box {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4c4c;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 999;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Contenedor para mostrar errores en pantalla -->
    <div id="error-box"></div>

    <!-- Canvas de AR -->
    <canvas id="ar-canvas"></canvas>

    <!-- Interfaz inicial -->
    <div id="ui-layer">
        <div class="card">
            <h1>Experiencia AR</h1>
            <p>Apunta tu cámara hacia un espacio libre en el suelo.<br>Asegúrate de estar ejecutando en localhost.</p>
            <button id="start-btn">Iniciar Experiencia</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --------------------------------------------------------
        // SOLUCIÓN CRÍTICA: Hacer THREE global para que 8th Wall lo vea
        // --------------------------------------------------------
        window.THREE = THREE;

        let modeloActual;
        let mixerAnimacion;
        const reloj = new THREE.Clock();

        // Función para mostrar errores en pantalla (sustituto seguro de alert)
        const mostrarError = (mensaje) => {
            const errorBox = document.getElementById('error-box');
            errorBox.textContent = mensaje;
            errorBox.style.display = 'block';
            console.error("DEBUG:", mensaje);
            
            // Restaurar el botón para volver a intentar
            const btn = document.getElementById('start-btn');
            btn.textContent = "Iniciar Experiencia";
            btn.disabled = false;
        };

        const creadorEscenaAR = () => {
            return {
                name: 'world-effect-ar',
                
                onStart: ({ canvas }) => {
                    try {
                        const { scene, camera, renderer } = XR8.Threejs.xrScene();

                        // Iluminación
                        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
                        const luzDir = new THREE.DirectionalLight(0xffffff, 2);
                        luzDir.position.set(5, 10, 7);
                        scene.add(luzDir);

                        // Cargar modelo
                        const loader = new GLTFLoader();
                        loader.load(
                            './assets/egg.glb',
                            (gltf) => {
                                modeloActual = gltf.scene;
                                modeloActual.scale.set(0.5, 0.5, 0.5);
                                
                                // Anclar modelo a 3 metros frente a la cámara (suelo)
                                modeloActual.position.set(0, 0, -3);
                                scene.add(modeloActual);

                                if (gltf.animations && gltf.animations.length > 0) {
                                    mixerAnimacion = new THREE.AnimationMixer(modeloActual);
                                    mixerAnimacion.clipAction(gltf.animations[0]).play();
                                }
                            },
                            undefined,
                            (error) => mostrarError("No se pudo cargar el huevo 3D (ruta incorrecta)")
                        );
                    } catch (error) {
                        mostrarError("Error configurando la escena: " + error.message);
                    }
                },

                onUpdate: () => {
                    const delta = reloj.getDelta();
                    if (modeloActual) modeloActual.rotation.y += 0.5 * delta;
                    if (mixerAnimacion) mixerAnimacion.update(delta);
                }
            };
        };

        const arrancarXR = () => {
            try {
                const canvas = document.getElementById('ar-canvas');
                
                XR8.addCameraPipelineModules([
                    XR8.GlTextureRenderer.pipelineModule(),
                    XR8.Threejs.pipelineModule(),
                    XR8.XrController.pipelineModule(),
                    creadorEscenaAR(),
                ]);

                XR8.run({ 
                    canvas: canvas,
                    // SOLUCIÓN CRÍTICA: Permitir PC de escritorio para facilitar las pruebas
                    allowedDevices: XR8.XrConfig.device().ANY 
                });
            } catch (error) {
                mostrarError("Fallo al ejecutar XR8: " + error.message);
            }
        };

        document.getElementById('start-btn').addEventListener('click', () => {
            const btn = document.getElementById('start-btn');
            const uiLayer = document.getElementById('ui-layer');

            // Verificar primero si el archivo de licencia xr.js existe
            if (typeof XR8 === 'undefined' && !window.XR8) {
                mostrarError("Error: No se encontró XR8. Verifica que './external/xr/xr.js' exista.");
                return;
            }

            btn.textContent = "Cargando Motor...";
            btn.disabled = true;

            // Desvanecer UI
            uiLayer.style.opacity = '0';
            setTimeout(() => { uiLayer.style.display = 'none'; }, 500);

            // Iniciar 8th Wall
            arrancarXR();
        });
    </script>
</body>
</html>

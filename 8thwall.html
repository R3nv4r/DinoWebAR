<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi Primera Esfera con 8th Wall (SLAM)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- 1. 8th Wall Engine Binary (Incluye SLAM) cargado desde CDN -->
    <!-- Cargamos xr.js desde el paquete @8thwall/engine-binary y pre-cargamos el chunk SLAM -->
    <script async src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam"></script>
    
    <!-- 2. XR Extras (Componentes UI, permisos, manejo de errores) -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

    <!-- 3. A-Frame (versión compatible, 1.3.0 es comúnmente usada con 8th Wall) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <style>
      /* Aseguramos que el canvas ocupe todo el espacio de la pantalla */
      body { 
        margin: 0; 
        overflow: hidden; 
      }
    </style>
  </head>
  <body>

    <a-scene
      xrextras-gesture-detector
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      xrweb>
      
      <!-- La cámara. 8th Wall toma el control de su posición y rotación basándose en tu entorno -->
      <a-camera position="0 1.6 0"></a-camera>
      
      <!-- Luces para que el modelo tenga volumen -->
      <a-light type="directional" position="1 2 -1" intensity="0.8"></a-light>
      <a-light type="ambient" intensity="0.5"></a-light>

      <a-assets>
        <!-- Reemplaza el enlace por la URL o ruta local de tu propio archivo .glb -->
        <!-- Como ejemplo, he puesto el modelo de un pato en 3D de prueba -->
        <a-asset-item id="modelo-personalizado" src="./assets/egg.glb"></a-asset-item>
      </a-assets>

      <a-entity 
        gltf-model="#modelo-personalizado" 
        position="0 0 -3" 
        scale="1 1 1" 
        shadow>
      </a-entity>
    </a-scene>
  </body>
</html>

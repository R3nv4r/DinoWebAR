<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi Primera Esfera con 8th Wall (SLAM)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- 1. A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- 2. XR Extras - Proporciona UI de carga, permisos de cámara y manejo de errores de 8th Wall -->
    <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
    
      <style>
      /* Aseguramos que el canvas ocupe todo el espacio de la pantalla */
      body { 
        margin: 0; 
        overflow: hidden; 
      }
    </style>
  </head>
  <body>
    <!-- 
      El atributo 'xrweb' es la magia de 8th Wall que activa el SLAM (World Tracking).
      Los componentes 'xrextras-*' añaden la pantalla de carga, solicitan permisos 
      de cámara automáticamente y manejan errores comunes.
    -->
    <a-scene
      xrextras-gesture-detector
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      xrweb>
      
      <!-- La cámara. 8th Wall toma el control de su posición y rotación basándose en tu entorno -->
      <a-camera position="0 1.6 0"></a-camera>
      
      <!-- Luces para que la esfera tenga volumen y no se vea plana -->
      <a-light type="directional" position="1 2 -1" intensity="0.8"></a-light>
      <a-light type="ambient" intensity="0.5"></a-light>

       <!-- Reemplaza el enlace por la URL o ruta local de tu propio archivo .glb -->
        <!-- Como ejemplo, he puesto el modelo de un pato en 3D de prueba -->
        <a-asset-item id="modelo-personalizado" src="./assets/egg.glb"></a-asset-item>
      </a-assets>

      <a-entity 
        gltf-model="#modelo-personalizado" 
        position="0 0 -3" 
        scale="1 1 1" 
        shadow>
      </a-entity>
    </a-scene>
  </body>
</html>

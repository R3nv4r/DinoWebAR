<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DinoWebAR con 8th Wall (SLAM)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- 1. A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- 2. Motor 8th Wall (Open Source SLAM) y XR Extras -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@latest/dist/xr.js" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@latest/dist/xrextras.js"></script>

    <script>
      AFRAME.registerComponent('tap-to-place', {
        init: function() {
          const ground = document.getElementById('ground');
          const modelo = document.getElementById('mi-modelo');
          
          // Cuando detectamos un toque en el suelo virtual
          ground.addEventListener('click', (event) => {
            // Obtenemos las coordenadas 3D del punto exacto tocado
            const point = event.detail.intersection.point;
            
            // Movemos el modelo a ese punto
            modelo.setAttribute('position', point);
            
            // Hacemos el modelo visible (ya que empieza oculto)
            modelo.setAttribute('visible', 'true');
          });
        }
      });
    </script>
    
    <style>
      /* Aseguramos que el canvas ocupe todo el espacio de la pantalla */
      body { 
        margin: 0; 
        overflow: hidden; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* ESTILOS DE LA PANTALLA DE BIENVENIDA */
      #welcome-screen {
        position: absolute;
        top: 0;
        left: 0;
            width: 100%;
            height: 100%;
            
            background: linear-gradient(135deg, #0cc42a 0%, #1b5700 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 5; 
            transition: opacity 0.5s ease;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
      }
      #welcome-screen.hidden {
        opacity: 0;
        pointer-events: none; /* Permite clickear la escena de fondo cuando está oculto */
      }
      .welcome-logo{
        width: 140px;
            height: 140px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center; 
            align-items: center; 
      }
      .welcome-logo img{
            width:160%;
        }
      .texto h1 { 
            margin: 0 0 10px 0;
            font-size: 36px;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 1px; }
      .texto p { 
            margin: 0 0 10px 0; 
            font-size: 18px;
            line-height: 1.6;
            max-width: 500px;
            color: #f0f0f0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
      .leyenda { 
            font-size: 14px;
            color: #8bf06c; 
            margin: 0; 
            top: 0px; }
      
      /* ESTILOS DE BOTONES */
      #btn-exit-ar {
            width: 30px;
            height: 40px;
            top: 0px;
            right: 0px;
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 20;
        }
      
      #btn-start {
        position: static !important; 
            transform: none !important; 
            width: auto !important; 
            left: auto !important;
            bottom: auto !important;
            opacity: 1 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            background-color: #ff8c00 !important; 
            color: white !important;
            border-radius: 30px !important; 
            border: 2px solid rgba(255, 255, 255, 0.8) !important; 
            font-weight: bold !important;
            padding: 16px 32px !important; 
            font-size: 16px !important; 
            line-height: 1 !important; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4) !important; 
            transition: transform 0.2s ease, background-color 0.2s ease !important;
            letter-spacing: 1px !important;
            white-space: nowrap !important; 
      }

      /* ESTILOS DE LA INTERFAZ AR */
      #ar-ui {
        position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex; 
            flex-direction: column;
            justify-content: flex-end;
            transition: opacity 0.3s ease, visibility 0.3s;
            opacity: 0;
            visibility: hidden;
      }
      #ar-ui.active {
        opacity: 1;
            visibility: visible;
      }
      
      #bottom-bar {
        display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            pointer-events: auto;
            padding-bottom: 50px;
            transition: opacity 0.3s ease;
      }
      /* Reactivar los clicks solo en los botones, no en la barra entera */
      #bottom-bar button {
        pointer-events: auto;
      }
    </style>
  </head>

  <body>
     <!-- PANTALLA DE BIENVENIDA -->
        
    <div id="welcome-screen">
       
        <div class="welcome-logo">
            <img src="assets/huevo_reduc.gif" alt="Huevo animado">
        </div>
        
        <div class="texto">
            <h1>DinoWebAR</h1>
        <p>Para iniciar esta experiencia acepte el permiso a la camara, presiona el boton ¡INICIAR!. y disfruta de la realidad Aumentada.</p>
        </div>
        
        <div class="leyenda">
            <p>XDevLAb  |  Todos los derechos reservados</p>
        </div>
        
        <button class="icon-btn" id="btn-start">¡Iniciar!</button>

    </div>
    <div id="ar-ui">

        <!-- Barra inferior de acciones -->
        <div id="bottom-bar">
            <!-- Botón de Salir (X) -->
            <button id="btn-exit-ar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
    </div>
    
    <!-- Añadimos 'tap-to-place' a la escena y configuramos el raycaster -->
    <a-scene
      tap-to-place
      xrextras-gesture-detector
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      xrweb="data-preload-chunks: slam"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .cantap">
      
      <!-- La cámara. 8th Wall toma el control de su posición y rotación basándose en tu entorno -->
      <a-camera position="0 1.6 0"></a-camera>
      
      <!-- Luces para que la esfera tenga volumen y no se vea plana -->
      <a-light type="directional" position="1 2 -1" intensity="0.8"></a-light>
      <a-light type="ambient" intensity="0.5"></a-light>

      <!-- 3. Apertura de assets corregida con timeout -->
      <a-assets timeout="10000">
        <a-asset-item id="huevo" src="./assets/egg.glb"></a-asset-item>
      </a-assets>
      
      <!-- Suelo virtual invisible para detectar dónde toca el usuario -->
      <a-plane 
        id="ground" 
        class="cantap" 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="1000" 
        height="1000" 
        material="transparent: true; opacity: 0;">
      </a-plane>

      <!-- Tu modelo, ahora con ID, posición inicial en 0 y oculto por defecto -->
      <a-entity 
        id="mi-modelo"
        gltf-model="#huevo" 
        position="0 0 0" 
        scale="1 1 1" 
        visible="false"
        shadow>
      </a-entity>
    </a-scene>
    
    <!-- LÓGICA DE INTERFAZ INTEGRADA -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const welcomeScreen = document.getElementById('welcome-screen');
        const btnStart = document.getElementById('btn-start');
        const arUI = document.getElementById('ar-ui');
        const btnExitAR = document.getElementById('btn-exit-ar');

        // 1. Botón INICIAR
        btnStart.addEventListener('click', () => {
          // Solicitar pantalla completa al navegador
          const elem = document.documentElement;
          if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(err => console.log("Error al intentar pantalla completa:", err));
          } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
            elem.webkitRequestFullscreen();
          } else if (elem.msRequestFullscreen) { /* IE11 */
            elem.msRequestFullscreen();
          }
          // Ocultar pantalla de bienvenida
          welcomeScreen.classList.add('hidden');
          // Mostrar interfaz AR
          arUI.classList.add('active');
        });

        // 2. Botón SALIR (X)
        btnExitAR.addEventListener('click', () => {
          // La forma más segura de salir y apagar la cámara en web es recargando la página
          window.location.reload();
        });
      });
    </script>
  </body>
</html>

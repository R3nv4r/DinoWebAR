<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi Primera Esfera con 8th Wall (SLAM)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- 1. A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- 2. Motor 8th Wall (Open Source SLAM) y XR Extras -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@latest/dist/xr.js" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@latest/dist/xrextras.js"></script>

    <script>
      AFRAME.registerComponent('tap-to-place', {
        init: function() {
          const ground = document.getElementById('ground');
          const modelo = document.getElementById('mi-modelo');
          
          // Cuando detectamos un toque en el suelo virtual
          ground.addEventListener('click', (event) => {
            // Obtenemos las coordenadas 3D del punto exacto tocado
            const point = event.detail.intersection.point;
            
            // Movemos el modelo a ese punto
            modelo.setAttribute('position', point);
            
            // Hacemos el modelo visible (ya que empieza oculto)
            modelo.setAttribute('visible', 'true');
          });
        }
      });
    </script>
      <style>
      /* Aseguramos que el canvas ocupe todo el espacio de la pantalla */
      body { 
        margin: 0; 
        overflow: hidden; 
      }
    </style>
  </head>

  <body>

    <!-- Añadimos 'tap-to-place' a la escena y configuramos el raycaster -->
    <a-scene
      tap-to-place
      xrextras-gesture-detector
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      xrweb="data-preload-chunks: slam"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .cantap">
      
      <!-- La cámara. 8th Wall toma el control de su posición y rotación basándose en tu entorno -->
      <a-camera position="0 1.6 0"></a-camera>
      
      <!-- Luces para que la esfera tenga volumen y no se vea plana -->
      <a-light type="directional" position="1 2 -1" intensity="0.8"></a-light>
      <a-light type="ambient" intensity="0.5"></a-light>

      <!-- 3. Apertura de assets corregida con timeout -->
      <a-assets timeout="10000">
        <a-asset-item id="huevo" src="./assets/egg.glb"></a-asset-item>
      </a-assets>
      
      <!-- Suelo virtual invisible para detectar dónde toca el usuario -->
      <a-plane 
        id="ground" 
        class="cantap" 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="1000" 
        height="1000" 
        material="transparent: true; opacity: 0;">
      </a-plane>

      <!-- Tu modelo, ahora con ID, posición inicial en 0 y oculto por defecto -->
      <a-entity 
        id="mi-modelo"
        gltf-model="#huevo" 
        position="0 0 0" 
        scale="1 1 1" 
        visible="false"
        shadow>
      </a-entity>
    </a-scene>
  </body>
</html>

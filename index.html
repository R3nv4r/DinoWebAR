<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DinoWebAR - Experiencia Inmersiva</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #ar-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex; 
            visibility: hidden;
            opacity: 0;
            flex-direction: column;
            justify-content: flex-end;
            transition: opacity 0.3s ease;
        }

        #bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            pointer-events: auto;
            padding-bottom: 50px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Clase para ocultar la barra inferior durante la captura */
        .hide-for-capture {
            opacity: 0;
            pointer-events: none !important;
            transform: translateY(20px);
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #btn-capture {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #000;
            background-color: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #btn-capture .inner-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #000;
        }

        /* Notificación flotante (Toast) para avisar al usuario */
       
        #toast-message {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
        }

        /* Contenedor del Carrusel de Modelos */
        #model-carousel-container {
            position: absolute;
            bottom: 120px; /* Se sitúa arriba de la barra inferior */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            box-sizing: border-box;
            display: none; /* Oculto por defecto */
            flex-direction: column;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease;
        }

        .carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .carousel-header h3 {
            margin: 0;
            font-size: 16px;
            color: #333;
            font-family: sans-serif;
        }

        #btn-close-carousel {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #555;
            padding: 0;
            line-height: 1;
        }

        #model-carousel {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 5px;
        }

        /* Estilo para los botones de cada modelo */
        .model-option {
            flex: 0 0 70px;
            height: 70px;
            background: #f0f0f0;
            border-radius: 12px;
            border: 2px solid transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .model-option.active {
            border-color: #000;
            background: #e0e0e0;
            transform: scale(0.95);
        }
        
        /* Ajuste para los SVG que inyectaremos */
        .model-option svg {
            width: 40px;
            height: 40px;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ar-ui">
        
        <!-- Mensaje flotante de captura -->
        <div id="toast-message">¡Pantalla limpia! Usa los botones de tu móvil para tomar captura.</div>

        <!-- Carrusel Selector de Modelos -->
        <div id="model-carousel-container" class="hide-for-capture">
            <div class="carousel-header">
                <h3>Elegir Modelo</h3>
                <button id="btn-close-carousel">&times;</button>
            </div>
            <div id="model-carousel">
                <!-- Se inyectarán desde JavaScript -->
            </div>
        </div>

        <!-- Barra inferior de acciones -->
        <div id="bottom-bar">
            <!-- Botón de Reposicionar -->
            <button class="icon-btn" id="btn-reposition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            </button>
            
            <!-- Botón de captura -->
            <button id="btn-capture">
                <div class="inner-circle"></div>
            </button>
            
            <!-- Botón de Modelos (Antes Galería) -->
            <button class="icon-btn" id="btn-models">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let camera, scene, renderer;
        let modelo3D, mixer; 
        const clock = new THREE.Clock(); 
        const loader = new GLTFLoader(); // Declarado global para reusarlo

        // CONFIGURACIÓN DE TUS MODELOS
        // Aquí puedes agregar todos los dinosaurios que quieras
        const modelosDisponibles = [
            { 
                id: 'egg', 
                url: 'assets/egg.glb', 
                scale: 0.1, 
                positionY: -0.2,
                // Pega tu código SVG dentro de estas comillas invertidas:
                svg: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle></svg>` 
            },
            { 
                id: 'dino1', 
                url: 'assets/dino1.glb', // Cambia a la ruta de tu modelo
                scale: 0.1, 
                positionY: -0.2,
                svg: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20M12 2v20"></path></svg>`
            },
            { 
                id: 'dino2', 
                url: 'assets/dino2.glb', // Cambia a la ruta de tu modelo
                scale: 0.1, 
                positionY: -0.2,
                svg: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>`
            }
        ];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const luzAmbiental = new THREE.AmbientLight(0xffffff, 1); 
            scene.add(luzAmbiental);
            
            const luzDireccional = new THREE.DirectionalLight(0xffffff, 2);
            luzDireccional.position.set(1, 2, 1);
            scene.add(luzDireccional);

            // Importante: alpha: true permite ver la cámara real detrás del render
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); 
            renderer.setPixelRatio(1); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); 
            renderer.xr.enabled = true;
            
            document.body.appendChild(renderer.domElement);
            
            const arOptions = {
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.getElementById('ar-ui') }
            };
            document.body.appendChild(ARButton.createButton(renderer, arOptions));

            renderer.xr.addEventListener('sessionstart', () => {
                const ui = document.getElementById('ar-ui');
                ui.style.visibility = 'visible';
                ui.style.opacity = '1';
            });
            
            renderer.xr.addEventListener('sessionend', () => {
                const ui = document.getElementById('ar-ui');
                ui.style.visibility = 'hidden';
                ui.style.opacity = '0';
                document.getElementById('model-carousel-container').style.display = 'none';
            });

            // Cargar el primer modelo de la lista por defecto
            cargarModelo(modelosDisponibles[0]);
           
            window.addEventListener('resize', onWindowResize, false);
            
            // Inicializar la interfaz del carrusel
            construirCarrusel();
        }

        // Función reutilizable para cambiar modelos
        function cargarModelo(modeloConfig) {
            // 1. Limpiar modelo anterior si existe
            if (modelo3D) {
                scene.remove(modelo3D);
            }
            if (mixer) {
                mixer.stopAllAction();
                mixer = null;
            }

            // 2. Cargar nuevo modelo
            loader.load(modeloConfig.url, function (gltf) {
                modelo3D = gltf.scene;
                modelo3D.scale.set(modeloConfig.scale, modeloConfig.scale, modeloConfig.scale); 
                modelo3D.position.set(0, modeloConfig.positionY, -1); 
                scene.add(modelo3D);
                
                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(modelo3D);
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });
                }
            }, undefined, function (error) {
                console.error("Error al cargar el modelo 3D:", error);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        // Referencias del DOM actualizadas
        const btnCapture = document.getElementById('btn-capture');
        const bottomBar = document.getElementById('bottom-bar');
        const toastMessage = document.getElementById('toast-message');
        
        const btnModels = document.getElementById('btn-models');
        const carouselContainer = document.getElementById('model-carousel-container');
        const btnCloseCarousel = document.getElementById('btn-close-carousel');
        const carouselDiv = document.getElementById('model-carousel');

        // Lógica de "Modo Captura de Pantalla"
        let toastTimeout;
        let uiTimeout;

        btnCapture.addEventListener('click', () => {
            // 1. Ocultar la barra inferior y el carrusel
            bottomBar.classList.add('hide-for-capture');
            carouselContainer.classList.add('hide-for-capture');
            
            // 2. Mostrar mensaje indicando que tomen la captura
            toastMessage.style.opacity = '1';

            // Limpiamos contadores
            clearTimeout(toastTimeout);
            clearTimeout(uiTimeout);

            // 3. Ocultar el mensaje a los 2.5 segundos
            toastTimeout = setTimeout(() => {
                toastMessage.style.opacity = '0';
            }, 2500);

            // 4. Restaurar la interfaz a los 8 segundos
            uiTimeout = setTimeout(() => {
                bottomBar.classList.remove('hide-for-capture');
                carouselContainer.classList.remove('hide-for-capture');
            }, 8000);
        });

        // Lógica del Carrusel
        btnModels.addEventListener('click', () => {
            // Alternar mostrar/ocultar
            if(carouselContainer.style.display === 'flex') {
                carouselContainer.style.display = 'none';
            } else {
                carouselContainer.style.display = 'flex';
            }
        });

        btnCloseCarousel.addEventListener('click', () => {
            carouselContainer.style.display = 'none';
        });

        function construirCarrusel() {
            modelosDisponibles.forEach((modelo, index) => {
                const btnItem = document.createElement('div');
                btnItem.className = 'model-option';
                if (index === 0) btnItem.classList.add('active'); // Primero activo por defecto
                
                // Inyectar el SVG configurado
                btnItem.innerHTML = modelo.svg;

                btnItem.addEventListener('click', () => {
                    // Actualizar estilos activos
                    document.querySelectorAll('.model-option').forEach(el => el.classList.remove('active'));
                    btnItem.classList.add('active');
                    
                    // Cargar el modelo
                    cargarModelo(modelo);
                });

                carouselDiv.appendChild(btnItem);
            });
        }

    </script>
</body>
</html>

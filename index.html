<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DinoWebAR - Experiencia Inmersiva</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #ar-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex; 
            flex-direction: column;
            justify-content: flex-end;
            transition: opacity 0.3s ease, visibility 0.3s;
            opacity: 0;
            visibility: hidden;
        }

        /* Clase para revelar la interfaz cuando inicia AR */
        #ar-ui.ar-active {
            opacity: 1;
            visibility: visible;
        }

        #btn-exit-ar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto; /* Importante para que pueda ser clickeado */
            z-index: 20;
        }

        #bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            pointer-events: auto;
            padding-bottom: 50px;
            transition: opacity 0.3s ease;
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #btn-capture {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #000;
            background-color: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #btn-capture .inner-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #000;
        }

        #model-carousel-container {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease;
        }

        .carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .carousel-header h2 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        #btn-close-carousel {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #333;
            padding: 0;
            line-height: 1;
        }

        #model-carousel {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 5px;
        }

        .model-option {
            flex: 0 0 70px;
            height: 70px;
            background: #f0f0f0;
            border-radius: 12px;
            border: 2px solid transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .model-option.active {
            border-color: #000;
            background: #e0e0e0;
            transform: scale(0.95);
        }

        .model-option svg {
            width: 40px;
            height: 40px;
        }

        .hide-for-capture {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .show-carousel {
            display: flex !important;
        }

        #toast-message {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-align: center;
            font-size: 16px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            width: 80%;
            max-width: 300px;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ar-ui">
        <!-- Botón de Salir (X) -->
        <button id="btn-exit-ar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <!-- Mensaje flotante de captura -->
        <div id="toast-message">¡Pantalla limpia! Usa los botones de tu móvil para tomar captura.</div>

        <!-- Carrusel de Modelos -->
        <div id="model-carousel-container">
            <div class="carousel-header">
                <h2>Modelos 3D</h2>
                <button id="btn-close-carousel">&times;</button>
            </div>
            <div id="model-carousel">
                <!-- Los botones se inyectan aquí dinámicamente -->
            </div>
        </div>

        <!-- Barra inferior de acciones -->
        <div id="bottom-bar">
            <!-- Botón de Reposicionar -->
            <button class="icon-btn" id="btn-reposition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            </button>
            
            <!-- Botón de captura -->
            <button id="btn-capture">
                <div class="inner-circle"></div>
            </button>
            
            <!-- Botón de Modelos (Abre el carrusel) -->
            <button class="icon-btn" id="btn-models">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. DECLARACIÓN DE VARIABLES GLOBALES
        let camera, scene, renderer;
        let modelo3D, mixer; 
        const clock = new THREE.Clock(); 
        const loader = new GLTFLoader();

        // 2. OBTENER REFERENCIAS DEL DOM (Se hace al principio para evitar errores)
        const arUI = document.getElementById('ar-ui');
        const btnExitAR = document.getElementById('btn-exit-ar');
        const btnCapture = document.getElementById('btn-capture');
        const bottomBar = document.getElementById('bottom-bar');
        const toastMessage = document.getElementById('toast-message');
        const btnModels = document.getElementById('btn-models');
        const carouselContainer = document.getElementById('model-carousel-container');
        const btnCloseCarousel = document.getElementById('btn-close-carousel');
        const carouselDiv = document.getElementById('model-carousel');

        // 3. CONFIGURACIÓN DE MODELOS
        const modelosDisponibles = [
            { 
                id: 'huevo', 
                url: 'assets/egg.glb', 
                scale: 0.1, 
                positionY: -0.2,
                svg: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle></svg>` 
            },
            { 
                id: 'pato_prueba', 
                url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb', 
                scale: 0.5, 
                positionY: -0.2,
                svg: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M22 12A10 10 0 1 1 12 2"></path></svg>` 
            }
        ];

        // 4. INICIALIZACIÓN
        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.visible = false; // Ocultar todo el mundo 3D hasta iniciar AR

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Iluminación
            const luzAmbiental = new THREE.AmbientLight(0xffffff, 1); 
            scene.add(luzAmbiental);
            
            const luzDireccional = new THREE.DirectionalLight(0xffffff, 2);
            luzDireccional.position.set(1, 2, 1);
            scene.add(luzDireccional);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); 
            renderer.setPixelRatio(1); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); 
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Botón AR con DOM Overlay
            const arOptions = {
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.getElementById('ar-ui') }
            };
            document.body.appendChild(ARButton.createButton(renderer, arOptions));

            // Gestión de visibilidad al entrar y salir de AR
            renderer.xr.addEventListener('sessionstart', () => {
                arUI.classList.add('ar-active'); // Mostrar interfaz
                scene.visible = true; // Mostrar el modelo 3D
            });

            renderer.xr.addEventListener('sessionend', () => {
                arUI.classList.remove('ar-active'); // Ocultar interfaz
                carouselContainer.classList.remove('show-carousel'); // Asegurar que el carrusel se cierre
                scene.visible = false; // Ocultar el modelo 3D
            });

            // Llenar el carrusel con botones antes de cargar el primer modelo
            construirCarrusel();

            // Cargar modelo inicial
            cargarModelo(modelosDisponibles[0]);
           
            window.addEventListener('resize', onWindowResize, false);
        }

        function cargarModelo(modeloConfig) {
            // Limpiar anterior
            if (modelo3D) {
                scene.remove(modelo3D);
            }
            if (mixer) {
                mixer.stopAllAction();
                mixer = null;
            }

            console.log("Cargando: ", modeloConfig.url);

            // Cargar nuevo
            loader.load(modeloConfig.url, function (gltf) {
                modelo3D = gltf.scene;
                modelo3D.scale.set(modeloConfig.scale, modeloConfig.scale, modeloConfig.scale); 
                modelo3D.position.set(0, modeloConfig.positionY, -1); 
                scene.add(modelo3D);
                
                // Animaciones
                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(modelo3D);
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });
                }
            }, undefined, function (error) {
                console.error("Error al cargar el modelo:", error);
                const textoOriginal = toastMessage.innerText;
                toastMessage.innerText = "Error cargando modelo";
                toastMessage.style.opacity = '1';
                setTimeout(() => { 
                    toastMessage.style.opacity = '0'; 
                    setTimeout(() => { toastMessage.innerText = textoOriginal; }, 300);
                }, 3000);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        // 5. EVENTOS DE LOS BOTONES
        let toastTimeout;
        let uiTimeout;

        // Botón Salir de AR (X)
        btnExitAR.addEventListener('click', () => {
            const session = renderer.xr.getSession();
            if (session) {
                session.end(); // Finaliza la sesión WebXR
            }
        });

        // Botón Capturar (Limpiar pantalla)
        btnCapture.addEventListener('click', () => {
            bottomBar.classList.add('hide-for-capture');
            carouselContainer.classList.add('hide-for-capture');
            carouselContainer.classList.remove('show-carousel'); // Asegurar cierre del carrusel
            
            toastMessage.style.opacity = '1';
            clearTimeout(toastTimeout);
            clearTimeout(uiTimeout);

            toastTimeout = setTimeout(() => {
                toastMessage.style.opacity = '0';
            }, 2500);

            uiTimeout = setTimeout(() => {
                bottomBar.classList.remove('hide-for-capture');
                carouselContainer.classList.remove('hide-for-capture');
            }, 8000);
        });

        // Botón Abrir Carrusel
        btnModels.addEventListener('click', () => {
            carouselContainer.classList.toggle('show-carousel');
        });

        // Botón Cerrar Carrusel
        btnCloseCarousel.addEventListener('click', () => {
            carouselContainer.classList.remove('show-carousel');
        });

        // Generar botones dentro del carrusel
        function construirCarrusel() {
            carouselDiv.innerHTML = ''; // Limpiar por si acaso
            modelosDisponibles.forEach((modelo, index) => {
                const btnItem = document.createElement('div');
                btnItem.className = 'model-option';
                if (index === 0) btnItem.classList.add('active');
                
                btnItem.innerHTML = modelo.svg;

                btnItem.addEventListener('click', () => {
                    document.querySelectorAll('.model-option').forEach(el => el.classList.remove('active'));
                    btnItem.classList.add('active');
                    cargarModelo(modelo);
                });

                carouselDiv.appendChild(btnItem);
            });
        }
    </script>
</body>
</html>

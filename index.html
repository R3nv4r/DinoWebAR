<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DinoWebAR- Experiencia AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./css/styles.css">
    <!-- 1. A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- Añadido: A-Frame Extras para reproducir las animaciones de los modelos GLB -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    
    <!-- 2. Motor 8th Wall (Open Source SLAM) y XR Extras -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@latest/dist/xr.js" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@latest/dist/xrextras.js"></script>
    <script src="./external/xr/xr.js"></script>
    <script src="./js/camara.js"></script>
  
  </head>

  <body>
     <!-- PANTALLA DE BIENVENIDA -->
        
    <div id="welcome-screen">
      <!--particulas-->
        <canvas id="canvas-polvo"></canvas>
       
        <div class="welcome-logo">
            <img src="assets/huevo_reduc.gif" alt="Huevo animado">
        </div>
        
        <div class="texto">
            <h1>DinoWebAR</h1>
        <p>Toca el botón ¡Iniciar! Activa tu cámara, interactúa con la pantalla y vive la experiencia de realidad aumentada.</p>
        </div>
         <button class="icon-btn" id="btn-start">¡Iniciar!</button>
        
        <div class="leyenda">
            <p>XDevLAb  |  Copyright © 2026 Niantic Spatial, Inc. El uso del motor XR está sujeto a la licencia del motor XR.</p>
        </div>
    </div>
    <div id="ar-ui">
        
        <button id="btn-exit-ar">X</button>

        <!-- Carrusel de Modelos -->
        <div id="model-carousel-container">
            <div id="model-carousel"></div>
            <button id="btn-close-carousel">×</button>
        </div>

        <!-- Barra inferior de acciones -->
        <div id="bottom-bar">
            <!-- Botón eliminar -->
            <button class="icon-btn" id="btn-eliminar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            </button>
            
            <!-- Botón de Captura (NUEVO) -->
            <button id="btn-capture">
                <div class="inner-circle"></div>
            </button>

            <!-- Botón de Modelos -->
            <button class="icon-btn" id="btn-models">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            </button>
        </div>
    </div>
    

    <!-- Añadimos preserveDrawingBuffer: true al renderer para permitir la captura de foto real + 3D -->
    <a-scene
      tap-to-place
      xrextras-gesture-detector
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true; preserveDrawingBuffer: true"
      xrweb="data-preload-chunks: slam"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .cantap">
      
      <!-- La cámara. 8th Wall toma el control de su posición y rotación basándose en tu entorno -->
      <a-camera position="0 1.6 0"></a-camera>
      
      <!-- Luces para que la esfera tenga volumen y no se vea plana -->
      <a-light type="directional" position="1 2 -1" intensity="0.8"></a-light>
      <a-light type="ambient" intensity="0.5"></a-light>

      <!-- 3. Apertura de assets corregida con timeout -->
      <a-assets timeout="10000">
        <a-asset-item id="huevo" src="./assets/modelos/Centrosaurus.glb"></a-asset-item>
      </a-assets>
      
      <!-- Suelo virtual invisible para detectar dónde toca el usuario -->
      <a-plane 
        id="ground" 
        class="cantap" 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="1000" 
        height="1000" 
        material="transparent: true; opacity: 0;">
      </a-plane>

      <!-- Tu modelo, ahora con la etiqueta animation-mixer añadida -->
      <a-entity 
        id="mi-modelo"
        gltf-model="#huevo" 
        position="0 0 0" 
        scale="1 1 1" 
        visible="false"
        animation-mixer="loop: repeat; timeScale: 1"
        shadow>
      </a-entity>
    </a-scene>
    
   </body>
</html>

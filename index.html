<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DinoWebAR - Experiencia Inmersiva</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #ar-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex; 
            visibility: hidden;
            opacity: 0;
            flex-direction: column;
            justify-content: flex-end;
            transition: opacity 0.3s ease;
        }

        #bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            pointer-events: auto;
            padding-bottom: 50px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Clase para ocultar la barra inferior durante la captura */
        .hide-for-capture {
            opacity: 0;
            pointer-events: none !important;
            transform: translateY(20px);
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #btn-capture {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #000;
            background-color: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #btn-capture .inner-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #000;
        }

        /* Notificación flotante (Toast) para avisar al usuario */
        #toast-message {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
        }

        #gallery-modal {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }

        #btn-close-gallery {
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #333;
        }
        
        .info-text {
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ar-ui">
        
        <!-- Mensaje flotante de captura -->
        <div id="toast-message">¡Pantalla limpia! Usa los botones de tu móvil para tomar captura.</div>

        <!-- Modal de Galería (informativa en este caso) -->
        <div id="gallery-modal">
            <div class="modal-header">
                <h2>Galería</h2>
                <button id="btn-close-gallery">&times;</button>
            </div>
            <p class="info-text">En experiencias WebXR nativas, las capturas de pantalla deben realizarse utilizando los botones de tu dispositivo (Volumen Abajo + Encendido) para incluir el mundo real.</p>
        </div>

        <!-- Barra inferior de acciones -->
        <div id="bottom-bar">
            <!-- Botón de Reposicionar -->
            <button class="icon-btn" id="btn-reposition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            </button>
            
            <!-- Botón de captura -->
            <button id="btn-capture">
                <div class="inner-circle"></div>
            </button>
            
            <button class="icon-btn" id="btn-gallery">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let camera, scene, renderer;
        let modelo3D, mixer; 
        const clock = new THREE.Clock(); 

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const luzAmbiental = new THREE.AmbientLight(0xffffff, 1); 
            scene.add(luzAmbiental);
            
            const luzDireccional = new THREE.DirectionalLight(0xffffff, 2);
            luzDireccional.position.set(1, 2, 1);
            scene.add(luzDireccional);

            // Importante: alpha: true permite ver la cámara real detrás del render
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); 
            renderer.setPixelRatio(1); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); 
            renderer.xr.enabled = true;
            
            document.body.appendChild(renderer.domElement);
            
            const arOptions = {
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.getElementById('ar-ui') }
            };
            document.body.appendChild(ARButton.createButton(renderer, arOptions));

            renderer.xr.addEventListener('sessionstart', () => {
                const ui = document.getElementById('ar-ui');
                ui.style.visibility = 'visible';
                ui.style.opacity = '1';
            });
            
            renderer.xr.addEventListener('sessionend', () => {
                const ui = document.getElementById('ar-ui');
                ui.style.visibility = 'hidden';
                ui.style.opacity = '0';
                document.getElementById('gallery-modal').style.display = 'none';
            });

            const loader = new GLTFLoader();
            loader.load('assets/egg.glb', function (gltf) {
                modelo3D = gltf.scene;
                modelo3D.scale.set(0.1, 0.1, 0.1); 
                modelo3D.position.set(0, -0.2, -1); 
                scene.add(modelo3D);
                
                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(modelo3D);
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });
                }
            }, undefined, function (error) {
                console.error("Error al cargar el modelo 3D:", error);
            });
           
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        // Referencias del DOM
        const btnCapture = document.getElementById('btn-capture');
        const bottomBar = document.getElementById('bottom-bar');
        const toastMessage = document.getElementById('toast-message');
        const btnGallery = document.getElementById('btn-gallery');
        const btnCloseGallery = document.getElementById('btn-close-gallery');
        const modalGallery = document.getElementById('gallery-modal');

        // Lógica de "Modo Captura de Pantalla"
        let captureTimeout;
        btnCapture.addEventListener('click', () => {
            // 1. Ocultar la barra inferior de UI
            bottomBar.classList.add('hide-for-capture');
            
            // 2. Mostrar mensaje indicando que tomen la captura
            toastMessage.style.opacity = '1';

            // 3. Restaurar todo después de 5 segundos
            clearTimeout(captureTimeout);
            captureTimeout = setTimeout(() => {
                toastMessage.style.opacity = '0';
                bottomBar.classList.remove('hide-for-capture');
            }, 5000);
        });

        // Eventos de la galería
        btnGallery.addEventListener('click', () => {
            modalGallery.style.display = 'flex';
        });

        btnCloseGallery.addEventListener('click', () => {
            modalGallery.style.display = 'none';
        });

    </script>
</body>
</html>
